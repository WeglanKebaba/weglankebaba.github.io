<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon"
    href="https://res.cloudinary.com/ddd8crevo/image/upload/v1760364982/b7cae8cd-fe61-48c6-8733-45f8892705a4.png"
    type="image/x-icon">
  <title>Wszystko biezpieczne do oglądania w pracy.</title>
  <style>
    body {
      font-family: Comic Sans MS;
      background-color: #000000;
      color: #FF9900;
      text-shadow: 2px 2px 2px #FF9900;
      margin: 0;
    }

    #content {
      padding: 2rem;
      text-align: center;
      transition: filter 6s ease;
    }

    body.modal-active #content {
      filter: blur(70px);
      pointer-events: none;
      user-select: none;
    }

    #photoModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: rgb(0, 0, 0);
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      max-width: 420px;
      width: 90%;
    }

    h2 {
      margin-bottom: 1rem;
    }

    input[type="file"] {
      margin-top: 1rem;
      font-size: 1rem;
      cursor: pointer;
    }

    button {
      padding: 0.6rem 1.2rem;
      margin: 1rem 0.3rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: Comic Sans MS;
      text-shadow: 2px 2px 2px black;
    }

    .confirm {
      background-color: #FF9900;
      color: white;
    }

    .back {
      background-color: #2d0707;
      color: white;
    }

    button:hover {
      transform: scale(1.3);
    }

    img {
      border-radius: 20px;
    }

    a{
        color: #FF9900;
        text-decoration: underline;
    }
    #flash {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      z-index: 2000;
      pointer-events: none;
    }

    .flash-active {
      animation: flashEffect 6s ease-out;
    }

    @keyframes flashEffect {
      0% { opacity: 0; }
      30% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body class="modal-active">
<div id="flash"></div>

  <div id="photoModal">
    <div class="modal-box">
      <h2>Aby uzyskać dostęp do treści, wyślij swoje zdjęcie<br>dowodu osobistego.</h2>
      <p>Btw nie jestem odpowiedzialny jeżeli ktoś was tu przyłapie.<br>
        Uzyskująć dostęp do zawartości godzin się na to.</p>

      <input type="file" id="photoInput" accept="image/*"><br>
      <button class="back" onclick="denyAccess()">Dobry wybór.</button>
    </div>
  </div>

  <div id="content">
    <p align="center">
      <img src="https://i3.wp.com/hentaitrap.com/uploads/post_items/image/large/932/9327234-04afd.gif" width="1300" height="700">
    </p>
    <h1 style="text-align:center;">
      <a href="https://weglankebaba.github.io/index.html">Dumny/a jesteś z tego widoku? Już mi stąd.</a>
    </h1>
  </div>

  <script>
    const fileInput = document.getElementById('photoInput');
    const flash = document.getElementById('flash');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        flash.classList.add('flash-active');
        setTimeout(() => {
          document.getElementById('photoModal').style.display = 'none';
          document.body.classList.remove('modal-active');
        }, 300);
      }
    });

    function denyAccess() {
      window.location.href = "https://weglankebaba.github.io/index.html";
    }
  </script>

</body>
</html>
